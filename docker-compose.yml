x-argilla-common: &argilla-common
  ARGILLA_HOME_PATH: /var/lib/argilla
  ARGILLA_ELASTICSEARCH: http://elasticsearch:9200
  ARGILLA_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-argilla:5432/argilla
  ARGILLA_REDIS_URL: redis://redis:6379/0

services:
  argilla:
    image: argilla/argilla-server:v2.8.0
    restart: unless-stopped
    ports:
      - "6900:6900"
    environment:
      <<: *argilla-common
      USERNAME: argilla
      PASSWORD: ${ARGILLA_PWD}
      API_KEY: ${ARGILLA_API_KEY}
      WORKSPACE: default
    networks:
      - argilla
    volumes:
      - argilladata:/var/lib/argilla
    depends_on:
      postgres-argilla:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  worker:
    image: argilla/argilla-server:v2.8.0
    environment:
      <<: *argilla-common
      BACKGROUND_NUM_WORKERS: 2
    networks:
      - argilla
    depends_on:
      postgres-argilla:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    command: sh -c 'python -m argilla_server worker --num-workers $${BACKGROUND_NUM_WORKERS}'

  postgres-argilla:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: argilla
    networks:
      - argilla
    volumes:
      - postgres-argilla-data:/var/lib/postgresql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - node.name=elasticsearch
      - cluster.name=es-argilla-local
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - argilla
    volumes:
      - elasticdata:/usr/share/elasticsearch/data/

  redis:
    image: redis:8.6.1
    networks:
      - argilla

  mlflow:
    restart: always
    image: ghcr.io/mlflow/mlflow:v3.10.0
    container_name: mlflow
    ports:
      - "5000:5000"
    command: >
      /bin/sh -c "
      until (pip install psycopg2-binary boto3) do echo '...waiting...' && sleep 1; done;
      mlflow server
      --backend-store-uri 'postgresql://mlflow_user:mlflow_pass@postgres-mlflow:5432/mlflow_db'
      --default-artifact-root 's3://mlflow/'
      --host 0.0.0.0
      --port 5000"
    networks:
      - mlflow_network
    environment:
      - AWS_ACCESS_KEY_ID=some_access_key
      - AWS_SECRET_ACCESS_KEY=some_secret_key
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      postgres-mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-mlflow-bucket:
        condition: service_completed_successfully

  postgres-mlflow:
    image: postgres:17-bookworm
    container_name: postgres-mlflow
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mlflow_user -d mlflow_db" ]
      interval: 2s
      timeout: 2s
      retries: 10
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_USER=mlflow_user
      - POSTGRES_PASSWORD=mlflow_pass
      - POSTGRES_DB=mlflow_db
    volumes:
      - postgres-mlflow-data:/var/lib/postgresql/data
    networks:
      - mlflow_network

  minio:
    restart: always
    image: quay.io/minio/minio
    container_name: minio
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=some_access_key
      - MINIO_ROOT_PASSWORD=some_secret_key
      - MINIO_STORAGE_USE_HTTPS=false
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - mlflow_network

  create-mlflow-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - minio-data:/data
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minioserver http://minio:9000 some_access_key some_secret_key) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing minioserver/mlflow && \
      /usr/bin/mc policy set download minioserver/mlflow && \
      /usr/bin/mc mirror /data/* minioserver/mlflow;
      "
    networks:
      - mlflow_network
    restart: "no"

networks:
  argilla:
    driver: bridge
  mlflow_network:
    driver: bridge

volumes:
  argilladata:
  elasticdata:
  postgres-argilla-data:
  postgres-mlflow-data:
  minio-data:
