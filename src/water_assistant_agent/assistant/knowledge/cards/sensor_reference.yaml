id: sensor_reference
title: What is measured on this building, and how it is recorded
provenance: static
text: |
  Measurements arrive in five tables, and each one holds a different kind of
  quantity.

  Soil moisture is recorded per segment as a volumetric water content, read by
  probes buried in the substrate; it is the quantity the irrigation rule and
  the reference ranges are stated in. Soil temperature is recorded per segment
  from the same kind of installation. Outflow is what leaves a segment's
  lysimeter, recorded in litres, which on these lysimeters is numerically a
  depth in millimetres because of the collection area. Radiation comes from
  masts mounted over individual segments, each reporting incoming and outgoing
  shortwave and longwave radiation together with surface temperature, the
  latter in kelvin rather than degrees. Weather comes from a single station
  serving the whole building, not per segment, and carries mean and maximum air
  temperature, rainfall, shortwave radiation, relative humidity and wind speed.

  Two gaps in that coverage are structural rather than accidental. The
  semi-intensive segment has no lysimeter and no radiation mast, so it appears
  in the soil tables and in neither of the other two. The outflow table also
  carries a pair of small test lysimeters that are not roof segments at all;
  they are separate experimental installations and should not be read as any
  segment's outflow.

  Everything is logged at half-hourly resolution and stored in a fixed
  timezone, while days are formed in the site's own local time, so a daily
  figure is an aggregate over that day's half-hourly rows rather than a
  reading. Which aggregation applies depends on the quantity: rainfall and
  outflow accumulate over the day, temperature has a daily mean and a daily
  maximum, and the rest are averaged.

  Two recording conventions matter when reading raw values. Wind speed carries
  a large negative sentinel value in place of a missing reading, which has to
  be excluded before averaging rather than treated as a measurement; the tools
  here exclude it. Outages appear as absent rows and never as empty ones, so a
  missing day is missing entirely, and a check written to look for empty values
  would never notice it.
