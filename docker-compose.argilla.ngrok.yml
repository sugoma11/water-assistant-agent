# Public HTTPS front for the Argilla UI (port 6900) via an ngrok tunnel, for
# handing the labeling UI to remote annotators without certs. Layer it on top of
# the Argilla stack; needs NGROK_AUTHTOKEN in the repo `.env`:
#
#   docker compose -f docker-compose.yml -f docker-compose.argilla.yml \
#     -f docker-compose.argilla.ngrok.yml up -d
#
# Or via just: `just dev-full-ngrok`. The public URL shows up in the ngrok
# inspector on http://localhost:4040.
services:
  ngrok:
    image: ngrok/ngrok:latest
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
      - "--log"
      - "stdout"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    configs:
      - source: ngrok_config
        target: /etc/ngrok.yml
    ports:
      - "0.0.0.0:4040:4040"
    networks:
      - argilla
    depends_on:
      - argilla

configs:
  ngrok_config:
    content: |
      version: "2"
      tunnels:
        argilla:
          proto: http
          addr: argilla:6900
