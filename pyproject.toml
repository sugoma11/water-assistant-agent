[project]
name = "evaluating-prompt-optimization-techniques-for-water-management-analysis-assistant-with-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "argilla>=2.8",
    "click>=8.3.1",
    "duckdb>=1.5.3",
    "litellm>=1.82.6",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.2",
    "sqlglot>=30.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/Evaluating_prompt_optimization_techniques_for_water_management_LLM_assistant_with_RAG",
    "src/experiments",
]

[project.scripts]
generate-questions = "experiments.generate_questions.generate_questions_with_terms:generate_questions"
generate-questions-cli = "experiments.generate_questions.generate_questions_with_cli:generate_questions"
generate-questions-cli-synth = "experiments.generate_questions.generate_questions_with_clii_synth_data:generate_questions"
text2sql-cli = "experiments.text2sql.text2sql_with_cli:text2sql"
argilla-labeling = "experiments.argilla_labeling.cli:main"
