[project]
name = "water-assistant-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13, <3.14"
# Prod runtime = the conversational assistant service (FastAPI + AG-UI + ADK).
dependencies = [
    "ag-ui-adk>=0.7",
    "argon2-cffi>=23.1",
    "asgi-correlation-id>=4.3",
    "asyncpg>=0.30",
    "duckdb>=1.5.3",
    "fastapi>=0.115",
    "google-adk>=1.21",
    "httpx>=0.27",
    "litellm>=1.82.6",
    "pandas>=2.3.3",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.0",
    "pyjwt>=2.10",
    "python-dotenv>=1.2.2",
    # The reference-card store is packaged YAML read at runtime by
    # `assistant/knowledge/store.py`, so pyyaml is a direct runtime dependency
    # rather than the transitive one it was.
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "sqlglot>=30.9.0",
    "structlog>=25.1",
    "tenacity>=9.1.4",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Dev/research: prompt-optimization experiments, labeling, tracking, and test tooling.
# Installed by `uv sync` (default); excluded by `uv sync --no-dev`.
[dependency-groups]
dev = [
    "argilla>=2.8",
    "boto3>=1.43.24",
    "click>=8.3.1",
    "datacompy>=1.0.1",
    "gepa>=0.1.1",
    "mlflow>=3.4",
    "skillopt>=0.1.0",
    "textgrad>=0.1.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore"]

[tool.uv.sources]

[tool.hatch.build.targets.wheel]
packages = [
    "src/water_assistant_agent",
    "src/experiments",
]

[project.scripts]
generate-questions = "experiments.generate_questions.generate_questions_with_terms:generate_questions"
generate-questions-cli = "experiments.generate_questions.generate_questions_with_cli:generate_questions"
generate-questions-cli-synth = "experiments.generate_questions.generate_questions_with_clii_synth_data:generate_questions"
text2sql-cli = "experiments.text2sql.text2sql_with_cli:text2sql"
text2sql-eval = "experiments.text2sql.eval:eval"
text2sql-train-gepa = "experiments.text2sql.train_gepa:train_gepa"
text2sql-train-textgrad = "experiments.text2sql.train_textgrad:train_textgrad"
text2sql-train-skillopt = "experiments.text2sql.train_skillopt:train_skillopt"
text2sql-sample = "experiments.text2sql.sampler:sample"
text2sql-paraphrase = "experiments.text2sql.paraphrase_questions:paraphrase_questions"
argilla-labeling = "experiments.argilla_labeling.cli:main"
water-assistant = "water_assistant_agent.assistant.app:main"
