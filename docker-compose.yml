# MLflow dev stack: MLflow tracking server + its Postgres backend store + MinIO
# artifact store. This is the lightweight half of the dev infra and the one you
# want running by default:
#
#   docker compose -f docker-compose.yml up -d      (or `just dev-up`)
#
# The Argilla labeling stack (Argilla + Elasticsearch + Redis + its own
# Postgres) is heavy and lives in docker-compose.argilla.yml; layer it on when
# you actually need to label:
#
#   docker compose -f docker-compose.yml -f docker-compose.argilla.yml up -d
#
# Or via just: `just dev-full-up`. The chat app's production stack is separate
# again (docker-compose.prod.yml).

services:
  mlflow:
    restart: always
    image: ghcr.io/mlflow/mlflow:v3.10.0
    container_name: mlflow
    ports:
      - "5000:5000"
    command: >
      /bin/sh -c "
      until (pip install psycopg2-binary boto3) do echo '...waiting...' && sleep 1; done;
      mlflow server
      --backend-store-uri 'postgresql://mlflow_user:mlflow_pass@postgres-mlflow:5432/mlflow_db'
      --default-artifact-root 's3://mlflow/'
      --host 0.0.0.0
      --port 5000"
    networks:
      - mlflow_network
    environment:
      - AWS_ACCESS_KEY_ID=some_access_key
      - AWS_SECRET_ACCESS_KEY=some_secret_key
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      postgres-mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-mlflow-bucket:
        condition: service_completed_successfully

  postgres-mlflow:
    image: postgres:17-bookworm
    container_name: postgres-mlflow
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mlflow_user -d mlflow_db" ]
      interval: 2s
      timeout: 2s
      retries: 10
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_USER=mlflow_user
      - POSTGRES_PASSWORD=mlflow_pass
      - POSTGRES_DB=mlflow_db
    volumes:
      - postgres-mlflow-data:/var/lib/postgresql/data
    networks:
      - mlflow_network

  minio:
    restart: always
    image: quay.io/minio/minio
    container_name: minio
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=some_access_key
      - MINIO_ROOT_PASSWORD=some_secret_key
      - MINIO_STORAGE_USE_HTTPS=false
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - mlflow_network

  create-mlflow-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - minio-data:/data
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minioserver http://minio:9000 some_access_key some_secret_key) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing minioserver/mlflow && \
      /usr/bin/mc policy set download minioserver/mlflow && \
      /usr/bin/mc mirror /data/* minioserver/mlflow;
      "
    networks:
      - mlflow_network
    restart: "no"

networks:
  mlflow_network:
    driver: bridge

volumes:
  postgres-mlflow-data:
  minio-data:
